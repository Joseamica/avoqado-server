# Avoqado Server CI/CD Pipeline
# ==============================
# This workflow handles testing and deployment to Render (production).
#
# ENVIRONMENT MAPPING:
# ┌─────────────────────────────────────────────────────────────────┐
# │ Push to develop                                                 │
# │ ↓                                                               │
# │ This workflow: test only (staging Render service disabled)     │
# │ fly-deploy.yml: deploy-demo (Fly.io - instant start)           │
# └─────────────────────────────────────────────────────────────────┘
# ┌─────────────────────────────────────────────────────────────────┐
# │ Push to main                                                    │
# │ ↓                                                               │
# │ This workflow: test → deploy-production (Render $7/mo)         │
# │ release.yml: create GitHub release (if version changed)        │
# └─────────────────────────────────────────────────────────────────┘
#
# SERVICE URLS:
#   - Production: https://avoqado-server.onrender.com (Render)
#   - Demo:       https://avoqado-server.fly.dev (Fly.io) - see fly-deploy.yml

name: 🚀 Avoqado Server CI/CD Pipeline

on:
  push:
    # 'ci/**' = carril de verificación por sesión (regla del workspace, 8-oct-2026): corre TODAS las pruebas y nunca
    # publica (los deploys sólo corren en main). La concurrencia es por rama: un carril no cancela a otro ni a develop.
    branches: [main, develop, 'ci/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  actions: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  # 🧪 Quality Gate: Test, lint and build
  test-and-build:
    name: 🧪 Test, Lint & Build
    runs-on: ubuntu-latest
    # The database is named for the disposable H1 fixture on purpose. Fourteen
    # integration suites delete data (rollback, cleanup, staff deletion,
    # concurrency) and refuse to run unless DATABASE_URL and TEST_DATABASE_URL
    # both point at this exact local name — a guard so they can never reach a
    # shared or real database. A CI service container IS that disposable
    # database, so it adopts the name instead of the guard being relaxed.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avoqado_h1a_test_20260808
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avoqado_h1a_test_20260808
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avoqado_h1a_test_20260808
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avoqado_h1a_test_20260808" --health-interval 10s --health-timeout 5s --health-retries 5
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      build-time: ${{ steps.build-info.outputs.build-time }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # CI más rápido (14-oct-2026, medido en docs/proyectos/pruebas-mas-rapidas-del-server--medicion-ci-14-oct.md):
      # lint 2 → 0 min cuando casi nada cambió. Va DESPUÉS de `npm ci`, que borra node_modules.
      # Es seguro: el lint revisa cada archivo por separado (ninguna regla mira otros archivos) y su caché se invalida si
      # cambia el contenido del archivo o la configuración. Si cambian dependencias o configuración (también la de
      # Prettier, que ESLint aplica), la llave cambia y se arranca en frío.
      # El typecheck ya NO usa caché (23-oct; ahorraba hasta 4 → 0.5 min): restaurar el .tsbuildinfo de dabad07 dio un
      # TS2540 que no existe (catalogImportConfirmation.service.test.ts:389) y tuvo rojo a develop; en frío, 0 errores.
      - name: 💾 Caché de lint
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/eslint
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc', '.prettierignore', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: lint-tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '.prettierrc', '.prettierignore', 'tsconfig*.json') }}-

      - name: 📏 Run ESLint
        run: npm run lint -- --cache --cache-location node_modules/.cache/eslint/ --cache-strategy content

      - name: 🔍 TypeScript compilation check
        run: npm run typecheck

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🏗️ Build application
        run: npm run build

      - name: 🏪 Run integration tests
        # 4 procesos en vez de 1 (24 → ~8 min, mismas pruebas; medido el 14-oct). Cada proceso usa su propia copia de la
        # base desechable (`<nombre>_<n>`, la crea TEMPLATE después de migrar; tests/__helpers__/base-por-proceso.ts la
        # elige con CI_DB_POR_PROCESO=1), así dos archivos nunca se pisan los datos. Mismo filtro que `npm run test:integration`.
        # Las PESADAS (un Cambio con el tope de 50 ventas y 50 pagos dentro de UNA transacción de 15 s) corren después y
        # solas: con los otros 3 procesos sobre el mismo Postgres la misma prueba tardó de 2.7 a 26.7 s y se pasó del
        # tope el 29-oct (run 40996059064). Solas miden el tope de producción sin el ruido de los vecinos.
        run: |
          npm run migrate:deploy:bounded
          for w in 1 2 3 4; do
            docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE avoqado_h1a_test_20260808_$w TEMPLATE avoqado_h1a_test_20260808"
          done
          PESADAS='tests/integration/exchanges/exchange(R7|Batch)\.integration\.test\.ts$'
          CI_DB_POR_PROCESO=1 npx jest --selectProjects=integration --maxWorkers=4 --detectOpenHandles=false --workerIdleMemoryLimit=2GB \
            --testPathIgnorePatterns='tests/integration/master-catalog/h1a-migration(?:-(?:lock-safety|replay))?\.integration\.test\.ts$' \
            --testPathIgnorePatterns="$PESADAS"
          npx jest --selectProjects=integration --runInBand --detectOpenHandles=false "$PESADAS"
        env:
          ACCESS_TOKEN_SECRET: test-access-token-secret
          REFRESH_TOKEN_SECRET: test-refresh-token-secret
          SESSION_SECRET: test-session-secret
          COOKIE_SECRET: test-cookie-secret
          OTP_PEPPER: test-otp-pepper-secret
          RABBITMQ_URL: amqp://localhost:5672
          OPENAI_API_KEY: test-openai-api-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          NODE_ENV: test
          # Tope por proceso. En UN proceso la memoria se acumulaba archivo tras archivo y los ~4 GB por defecto se
          # agotaron (run 38042072801, exit 134). Con 4 procesos, --workerIdleMemoryLimit=2GB reinicia el que pase de 2 GB
          # al terminar un archivo, así que los 8 GB son sólo techo; el runner trae 16 GB.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: 📋 Get package version
        id: package-version
        run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: ⏰ Build info
        id: build-info
        run: echo "build-time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: 📤 Upload Prisma schema
        uses: actions/upload-artifact@v4
        with:
          name: prisma-schema-${{ github.sha }}
          path: prisma/
          retention-days: 7

  # 🧪 Unit tests: UNA máquina con 4 procesos (14-oct-2026). Antes eran 4 máquinas con 2 procesos cada una: cada una
  # instalaba todo otra vez (~2 min) y sumaban 28.8 min facturables; así son ~8.7 min con las mismas 26,911 pruebas.
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 💾 Restore Jest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'jest.config.js', 'tsconfig.json', 'tsconfig.build.json') }}
          restore-keys: |
            jest-${{ runner.os }}-node20-

      - name: 🧪 Run unit tests
        # Lo mismo que `npm run test:unit:ci`, con 4 procesos en vez de 2 (el runner trae 4 núcleos).
        # Las de cronómetro (miden el event loop contra 50 ms) corren después y solas: con 4 procesos compartiendo CPU
        # daban rojos falsos (59.7 ms, 22-oct). La guardia de deployProduccionCommitExacto exige que CRONOMETRO sea
        # exactamente los archivos que importan el arnés o utils/eventLoopBudget: ninguna queda fuera.
        run: |
          START=$(date +%s)
          CRONOMETRO='tests/unit/(utils/eventLoopBudget|services/dashboard/sale-verification\.org\.eventloop-budget|services/master-catalog/(catalogImport(Canonical|Dependencies|DurableEventLoop|FieldValidation|StagedPayload)\.service|catalogWorkbook\.eventloop-budget))\.test\.ts$'
          NODE_OPTIONS='--max-old-space-size=4096' npx jest tests/unit --maxWorkers=4 --workerIdleMemoryLimit=512MB --detectOpenHandles=false --verbose=false --cacheDirectory=node_modules/.cache/jest --testPathIgnorePatterns="$CRONOMETRO"
          NODE_OPTIONS='--max-old-space-size=4096' npx jest "$CRONOMETRO" --runInBand --detectOpenHandles=false --verbose=false --cacheDirectory=node_modules/.cache/jest
          END=$(date +%s)
          echo "Unit tests (1 job, 4 workers) duration: $((END - START)) seconds" >> "$GITHUB_STEP_SUMMARY"

  # 🌐 API middleware tests: route mounting + auth + checkPermission + Zod on
  # every endpoint. Mock-based (setup.ts forces a dummy DATABASE_URL) — needs
  # no DB service. This suite rotted for 7 months while wired into no gate
  # (2025-11 → 2026-07, 76 stale failures); keep it visible in CI.
  # OBSERVATIONAL for now (continue-on-error, not in any deploy `needs`):
  # freshly revived suite — it must prove itself flake-free for a few weeks
  # before being promoted to a required deploy gate. The blocking gate today
  # is local: scripts/pre-deploy-check.sh step 6b.
  api-tests:
    name: 🌐 API Middleware Tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 💾 Restore Jest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'jest.config.js', 'tsconfig.json', 'tsconfig.build.json') }}
          restore-keys: |
            jest-${{ runner.os }}-node20-

      - name: 🌐 Run API middleware tests
        # Each shard starts a fresh process so the accumulated Jest heap stays bounded.
        # All API test files still run; keep the same assertions and 4 GB heap.
        run: |
          for SHARD in 1 2 3 4; do
            npm run test:api -- --shard="${SHARD}/4"
          done

  # NOTE: Staging deploy disabled — Render staging service is suspended.
  # Demo environment (Fly.io) is still active via fly-deploy.yml.
  # Uncomment this job if/when Render staging is re-enabled.
  #
  # deploy-staging:
  #   name: 🚀 Deploy to Staging
  #   needs: test-and-build
  #   runs-on: ubuntu-latest
  #   if: |
  #     (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
  #     (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
  #   environment:
  #     name: staging
  #     url: ${{ vars.STAGING_API_URL }}
  #
  #   steps:
  #     - name: 🚀 Deploy to Render (Staging)
  #       uses: johnbeynon/render-deploy-action@v0.0.8
  #       with:
  #         service-id: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
  #         api-key: ${{ secrets.RENDER_API_KEY }}
  #
  #     - name: ⏳ Wait for deployment to stabilize
  #       run: |
  #         echo "⏳ Waiting for deployment to complete..."
  #         sleep 90
  #
  #     - name: 🏥 Comprehensive health check
  #       run: |
  #         echo "🏥 Performing health checks..."
  #
  #         # Basic health check
  #         for i in {1..10}; do
  #           if curl -f -s ${{ vars.STAGING_API_URL }}/health; then
  #             echo "✅ Basic health check passed!"
  #             break
  #           fi
  #           echo "⏳ Health check attempt $i failed, retrying in 10 seconds..."
  #           sleep 10
  #         done
  #
  #         # Extended API tests
  #         echo "🔍 Testing API endpoints..."
  #         curl -f -s ${{ vars.STAGING_API_URL }}/health | jq '.' || echo "❌ JSON response invalid"
  #
  #         echo "✅ Staging deployment successful!"
  #
  #     - name: 📢 Notify staging deployment
  #       if: always()
  #       run: |
  #         STATUS="${{ job.status }}"
  #         if [ "$STATUS" = "success" ]; then
  #           echo "🎉 ✅ Staging deployment completed successfully!"
  #           echo "📍 Environment: ${{ vars.STAGING_API_URL }}"
  #           echo "📦 Version: ${{ needs.test-and-build.outputs.version }}"
  #           echo "🕐 Build time: ${{ needs.test-and-build.outputs.build-time }}"
  #         else
  #           echo "❌ 🚨 Staging deployment failed!"
  #           exit 1
  #         fi

  # 🏭 Deploy to Production Environment
  deploy-production:
    name: 🏭 Deploy to Production
    needs: [test-and-build, unit-tests]
    runs-on: ubuntu-latest
    # Render tarda ~8 min y el script espera hasta 30 (90 consultas cada 20 s): este tope corta cualquier cuelgue.
    timeout-minutes: 45
    # Sólo desde main, también el botón manual: un dispatch desde otra rama probaba ESA rama y Render subía main sin
    # revisarlo (3-oct-2026). Fijado en tests/unit/architecture/deployProduccionCommitExacto.test.ts.
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
      )
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏭 Deploy the EXACT tested commit to Render and wait for LIVE
        id: deploy
        # La acción anterior pedía «despliega» sin commit y Render subía lo último de main: el 5-oct subió un commit
        # cuyas pruebas ni habían empezado. El script pide este commit exacto, sigue ESE deploy por su id y nunca
        # despliega hacia atrás (re-correr una corrida vieja no regresa producción).
        # El id del servicio se lee de RENDER_DEPLOY_SERVICE_ID y, mientras no exista, del nombre anterior. Al re-correr una
        # corrida de antes del arreglo, GitHub usa SU workflow viejo (el de «lo último de main»), que lee el nombre
        # anterior: cuando el founder cree el secreto nuevo y BORRE RENDER_PRODUCTION_SERVICE_ID, esas corridas ya no
        # podrán desplegar. El respaldo evita que una publicación falle mientras tanto.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_DEPLOY_SERVICE_ID || secrets.RENDER_PRODUCTION_SERVICE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash .github/scripts/render-deploy-commit-exacto.sh

      - name: 🏥 Production health verification
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          echo "🏥 Performing comprehensive production health checks..."
          # Antes, 15 intentos fallidos terminaban igual en «successful»: ahora hace falta uno bueno.
          OK=false
          for i in $(seq 1 15); do
            if HEALTH_RESPONSE="$(curl -fsS --max-time 10 "${{ vars.PRODUCTION_API_URL }}/health")"; then
              echo "📊 Health response: $HEALTH_RESPONSE"
              if echo "$HEALTH_RESPONSE" | jq -e '.' > /dev/null; then
                echo "✅ Production health check $i passed!"
                OK=true
                break
              fi
              echo "❌ Invalid JSON response"
            fi
            echo "⏳ Production health check attempt $i failed, retrying in 15 seconds..."
            sleep 15
          done
          if [ "$OK" != true ]; then
            echo "❌ Production health check failed 15 times"
            exit 1
          fi
          echo "🎉 Production deployment successful!"

      - name: 📢 Notify production deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ] && [ "${{ steps.deploy.outputs.deployed }}" != "true" ]; then
            echo "⏭️ No se desplegó ${{ github.sha }}: ya estaba LIVE o producción ya tiene uno más nuevo."
          elif [ "$STATUS" = "success" ]; then
            echo "🎉 ✅ 🏭 PRODUCTION DEPLOYMENT SUCCESSFUL! 🏭 ✅ 🎉"
            echo "📍 Environment: ${{ vars.PRODUCTION_API_URL }}"
            echo "📦 Version: ${{ needs.test-and-build.outputs.version }}"
            echo "🕐 Build time: ${{ needs.test-and-build.outputs.build-time }}"
            echo "🚀 Commit: ${{ github.sha }}"
          else
            echo "❌ 🚨 PRODUCTION DEPLOYMENT FAILED! 🚨 ❌"
            exit 1
          fi

  # 👀 PR Preview and Quality Report
  deploy-preview:
    name: 👀 PR Preview & Quality Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test-and-build, unit-tests]

    steps:
      - name: 💬 Enhanced PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const buildTime = '${{ needs.test-and-build.outputs.build-time }}';
            const version = '${{ needs.test-and-build.outputs.version }}';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Build Successful! Ready for Review

            ### 📋 Build Summary
            - **Branch**: \`${pr.head.ref}\`
            - **Commit**: \`${context.sha.substring(0, 7)}\`
            - **Version**: \`${version}\`
            - **Built at**: \`${buildTime}\`

            ### 🔍 Quality Checks
            - ✅ **ESLint**: No issues found
            - ✅ **TypeScript**: Compilation successful
            - ✅ **Unit Tests**: All passing
            - ✅ **Integration Tests**: All passing
            - ✅ **Build**: Successful

            ### 🗄️ Database
            - **Neon Branch**: \`pr-${context.issue.number}\` will be created when merged
            - **Migrations**: Will be applied automatically

            ### 📦 Artifacts
            - **Build files**: Available for 7 days
            - **Prisma schema**: Included for migration review

            ---

            🎯 **Ready for code review!** All automated checks have passed.`
            });

      - name: 📊 Build metrics
        run: |
          echo "📊 Build Metrics Summary:"
          echo "🕐 Build completed at: ${{ needs.test-and-build.outputs.build-time }}"
          echo "📦 Version: ${{ needs.test-and-build.outputs.version }}"
          echo "🔄 Workflow run: ${{ github.run_number }}"
          echo "📝 Commit: ${{ github.sha }}"
