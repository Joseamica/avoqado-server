# ⚠️ PRUEBA DE COSTO EN UBICLOUD (12-oct-2026) — rama desechable, NO FUSIONAR.
# Sólo corre en ramas ci/ubicloud-**; sin jobs de deploy; permisos de sólo lectura.
name: 🧪 PRUEBA Ubicloud — 4 · Chequeo mínimo (instalar + typecheck + build)

on:
  push:
    branches: ['ci/ubicloud-**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  minimal-check:
    name: ⚡ Chequeo mínimo
    runs-on: ubicloud-standard-4
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avoqado_h1a_test_20260808
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Máquina (para la medición)
        run: echo "nproc=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')GB cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 💾 Restaurar node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ runner.arch }}-node20-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies (sólo si no hubo caché)
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: 💾 Guardar node_modules (recién instalado, antes de compilar)
        if: steps.nm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.nm.outputs.cache-primary-key }}

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 TypeScript compilation check
        run: npm run typecheck

      - name: 🏗️ Build application
        run: npm run build
